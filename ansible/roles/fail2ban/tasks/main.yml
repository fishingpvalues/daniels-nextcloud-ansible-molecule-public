---
- name: Install Fail2Ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Ensure Fail2Ban is enabled and started
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Configure jail.local to never ban local subnet
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      ignoreip = 127.0.0.1/8 ::1 {{ local_subnet }}
      bantime  = 1h
      findtime  = 10m
      maxretry = 5
      backend = auto
      [sshd]
      enabled = true
      [nginx-http-auth]
      enabled = true
      [nginx-botsearch]
      enabled = true
      [nextcloud]
      enabled = true
      port = http,https
      filter = nextcloud
      logpath = /var/www/nextcloud/data/nextcloud.log
      maxretry = 5
      bantime = 1h
      findtime = 10m
    owner: root
    group: root
    mode: '0644'
  notify: Restart fail2ban

- name: Ensure fail2ban-client reloads config
  ansible.builtin.command: fail2ban-client reload
  changed_when: false
