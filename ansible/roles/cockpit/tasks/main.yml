---
- name: Install Cockpit
  ansible.builtin.apt:
    name: cockpit
    state: present
    update_cache: true

- name: Ensure Cockpit is enabled and started
  ansible.builtin.systemd:
    name: cockpit
    enabled: true
    state: started

- name: Ensure Cockpit Socket is enabled and started
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started
