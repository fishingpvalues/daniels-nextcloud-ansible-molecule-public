---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set UFW default policies
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow outgoing by default
  community.general.ufw:
    state: enabled
    policy: allow
    direction: outgoing

- name: Allow SSH from local subnet
  community.general.ufw:
    rule: allow
    port: 22
    proto: tcp
    from_ip: "{{ local_subnet }}"

- name: Allow HTTP/HTTPS from local subnet
  community.general.ufw:
    rule: allow
    port: "80,443"
    proto: tcp
    from_ip: "{{ local_subnet }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: 'on'
