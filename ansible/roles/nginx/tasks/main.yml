---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Ensure Nginx is enabled and started
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Deploy Nextcloud Nginx config
  ansible.builtin.template:
    src: nginx-nextcloud.conf.j2
    dest: /etc/nginx/sites-available/nextcloud
    owner: root
    group: root
    mode: '0644'

- name: Enable Nextcloud site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/nextcloud
    dest: /etc/nginx/sites-enabled/nextcloud
    state: link
    force: true

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Test Nginx config
  ansible.builtin.command: nginx -t
  register: nginx_test
  changed_when: false

- name: Reload Nginx if config is valid
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when: nginx_test.rc == 0
